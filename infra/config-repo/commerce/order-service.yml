server:
  port: 0

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

feign:
  client:
    config:
      # Общие таймауты применяются ко всем Feign-клиентам order-service,
      # если для конкретного клиента не задано отдельное значение.
      default:
        connectTimeout: 3000
        readTimeout: 3000
      # Отдельные, более узкие таймауты для складского вызова: резервирование должно
      # отвечать быстрее, чем каталог, и на нём же включено BASIC-логирование Feign.
      inventory-service:
        connectTimeout: 2000
        readTimeout: 4000
        loggerLevel: BASIC

logging:
  level:
    # Уровень BASIC для клиента задаётся выше (feign.client.config.inventory-service.loggerLevel),
    # но сами логи появятся только если Java-логгер интерфейса включён на DEBUG.
    ru.yandex.practicum.order.client.InventoryClient: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
server:
  port: 8081

spring:
  application:
    name: analyzer
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: postgres
    password: postgres

kafka:
  server: localhost:9092
  retry-period-ms: 5000
  consumer:
    snapshot-processor:
      topic: telemetry.snapshots.v1
      client-id: snapshot-processor-1
      group-id: snapshot-processor
    hub-event-processor:
      topic: telemetry.hubs.v1
      client-id: hub-event-processor-1
      group-id: hub-event-processor
    poll-timeout: 1000

logging:
  level:
    shm.telemetry.analyzer: DEBUG

grpc:
  client:
    hub-router:
      address: static://localhost:59090
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext
      send-timeout-ms: 1000
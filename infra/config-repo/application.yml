spring:
  main:
    banner-mode: off
    log-startup-info: false

logging:
  level:
    ru.yandex.practicum.telemetry: WARN
    org:
      springframework: ERROR
      apache.kafka: WARN

kafka:
  bootstrap-servers: "localhost:9092"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # По умолчанию instance-id строится с плейсхолдером ${server.port}, который при
    # server.port: 0 резолвится ДО того, как сервер реально выберет случайный порт.
    # В результате у всех инстансов на одном хосте получается одинаковый instance-id,
    # и Eureka считает их одной и той же записью — каждый новый запуск перезатирает
    # предыдущую. random.value гарантирует уникальность на каждый процесс.
    instance-id: ${spring.application.name}:${random.value}